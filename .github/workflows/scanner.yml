name: M&A Target Scanner

on:
  schedule:
    # Run every 15 minutes during market hours (9:30 AM - 4:00 PM ET)
    # Cron times are in UTC, so adjust for ET (UTC-5 or UTC-4 depending on DST)
    # During standard time (EST): 14:30-21:00 UTC
    # During daylight time (EDT): 13:30-20:00 UTC
    # This runs every 15 minutes from 13:30-21:00 UTC to cover both
    - cron: '30,45 13 * * 1-5'  # 1:30 PM, 1:45 PM UTC
    - cron: '0,15,30,45 14-20 * * 1-5'  # Every 15 min from 2 PM - 8:45 PM UTC
    - cron: '0 21 * * 1-5'  # 9:00 PM UTC
    
  # Allow manual triggering
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run M&A Scanner
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python acquisition_scanner.py
